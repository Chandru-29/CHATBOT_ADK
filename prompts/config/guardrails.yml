# StitchGuard — Unified Guardrails Configuration

# ── Layer 1: Input Prompt Validation
input_safety:
  max_characters: 1000
  
  # Regex patterns to detect prompt injection/jailbreak attempts
  jailbreak_patterns:
    - "(?i)developer\\s+mode"
    - "(?i)(ignore|skip|bypass|disregard|forget|override)\\s+.*(instruction|instructions|rule|rules|prompt|prompts|guideline|guidelines)"
    - "(?i)(show|display|reveal|print|tell|list|give)\\s+.*(system\\s+)?(instruction|instructions|system\\s+prompt|prompts|initial\\s+prompt)"
    - "(?i)jailbreak"
    - "(?i)dan\\s+mode"
    - "(?i)system\\s+override"
    - "(?i)translate\\s+the\\s+instructions"
    
  # Regex patterns to identify and redact PII from user inputs
  pii_patterns:
    ssn: "\\b\\d{3}-\\d{2}-\\d{4}\\b"
    email: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b"
    phone: "\\b(?:\\+?\\d{1,3}[-.\\s]*)?\\(?\\d{3}\\)?[-.\\s]*\\d{3}[-.\\s]*\\d{4}\\b"
    credit_card: "\\b(?:\\d[ -]*?){13,16}\\b"

# ── Layer 3: Agent Table Domain Scoping
# Restricts SQL generation compile-time access to specific tables
agent_domain_scopes:
  WMS_AGENT:
    allowed_tables:
      - "ITEM"
      - "SKUITEM"
      - "SULOCATION"
      - "LOCATION"
      - "PICKLIST"
      - "PICKLISTITEM"
      - "PICKLISTVIEW"
      - "GRN"
      - "FGMODEL"
      - "ITEMLOCACNMAP"
      - "FGTRANSACTION"
      - "SUIDACTIVITYLOG"
      - "WAREHOUSE"
      - "user"

# ── Layer 4: SQL Execution Security
database_safety:
  # Any query must begin with one of these prefix verbs (ignoring whitespace)
  allowed_prefixes:
    - "SELECT"
    - "WITH"
    - "SHOW"
    - "DESC"
    - "DESCRIBE"
    - "EXPLAIN"

  # Forbidden write/DML/DDL keywords
  banned_keywords:
    - "INSERT"
    - "UPDATE"
    - "DELETE"
    - "DROP"
    - "CREATE"
    - "ALTER"
    - "TRUNCATE"
    - "REPLACE"
    - "ATTACH"
    - "DETACH"
    - "PRAGMA"
    - "BEGIN"
    - "COMMIT"
    - "ROLLBACK"
    - "VACUUM"
    - "REINDEX"
    - "GRANT"
    - "REVOKE"
    - "SAVEPOINT"
    - "RELEASE"
    # SQL Server-specific attack vectors
    - "EXEC"
    - "EXECUTE"
    - "OPENROWSET"
    - "OPENQUERY"
    - "BULK"
    - "DBCC"
    - "SHUTDOWN"
    - "BACKUP"
    - "RESTORE"

  # System/Catalog schemas that must never be accessed
  banned_schemas:
    - "sys"
    - "master"
    - "tempdb"
    - "msdb"
    - "model"

# ── Layer 5: Output Sanitization
output_safety:
  # Columns to completely drop and omit from DB query results before passing to output/formatting
  redact_columns:
    - "password"
    - "password_hash"
    - "passwd"
    - "ssn"
    - "secret_key"
    - "api_key"
    - "review_id"
    - "credit_card"
    - "salt"
    - "emp id"
    - "emp_id"
    - "empid"
    - "employee_id"
    - "employeeid"
    - "employee id"
    - "employees_id"
    - "employeesid"
    - "employees id"
    - "emp_no"
    - "employee_no"
    - "customer_id"
    - "customerid"
    - "customer id"
    - "customers_id"
    - "customersid"
    - "customers id"
    - "project_id"
    - "order_id"
    - "product_id"
    - "phone_number"
    - "phonenumber"
    - "email"
    - "email_id"
    - "email_address"
    - "id"
    - "ID"


  # ── Layer 6: Output Content Safety ──

  # L6.2: Forbidden patterns in LLM's natural-language answer
  # Matches are replaced with [FILTERED] before the response reaches the user
  forbidden_output_patterns:
    - "(?i)mysql://|postgres://|sqlite://|mongodb://|mssql://|Server=.*Database="
    - "(?i)connection[_\\s]?string"
    - "(?i)password\\s*[:=]\\s*\\S+"
    - "(?i)api[_\\s]?key\\s*[:=]\\s*\\S+"
    - "(?i)SELECT\\s+.{10,}\\s+FROM\\s+"
    - "(?i)INSERT\\s+INTO|UPDATE\\s+\\w+\\s+SET|DELETE\\s+FROM"

  # L6.3: Internal terms to scrub from user-facing answers
  # Each entry has a regex pattern and a replacement string
  scrub_internal_terms:
    - pattern: "\\b(from|in|the)\\s+(PICKLIST|PICKLISTITEM|PICKLISTVIEW|SULOCATION|SKUITEM|ITEM|LOCATION|GRN|FGTRANSACTION|WAREHOUSE|ITEMLOCACNMAP|FGMODEL|SUIDACTIVITYLOG)\\s+table\\b"
      replacement: "from the records"
    - pattern: "\\bI queried\\b"
      replacement: "Based on the data"
    - pattern: "\\bthe database\\s+(returned|shows|contains)\\b"
      replacement: "the data \\1"
    - pattern: "\\bJOIN\\s+\\[?\\w+\\]?\\s+\\w+\\s+ON\\b"
      replacement: "from the records"
    - pattern: "\\bWHERE\\s+\\w+\\.isDeleted\\s*=\\s*0\\b"
      replacement: ""

  # L6.4: Maximum characters allowed in LLM response
  max_response_characters: 5000
